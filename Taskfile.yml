version: '3'

# Thin wrappers around the npm workspace scripts (see package.json).
# Ports: server ws://localhost:8080 (PORT overrides), client http://localhost:5173.

tasks:
  install:
    desc: 의존성 설치 (package.json/lock 변경 시에만 실행)
    sources:
      - package.json
      - package-lock.json
      - packages/*/package.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm install

  dev:
    desc: 서버(봇 포함)와 클라이언트 개발 서버를 함께 실행
    deps: [install]
    cmds:
      - npm run dev

  server:
    desc: 게임 서버만 실행 (PORT 환경 변수로 포트 변경)
    deps: [install]
    cmds:
      - npm run start -w @snake/server

  client:
    desc: 클라이언트 개발 서버만 실행 (VITE_WS_URL로 서버 주소 지정)
    deps: [install]
    cmds:
      - npm run dev -w @snake/client

  test:
    desc: 전체 테스트 실행
    deps: [install]
    cmds:
      - npm test

  typecheck:
    desc: 전체 패키지 타입 검사
    deps: [install]
    cmds:
      - npm run typecheck

  build:
    desc: 클라이언트 프로덕션 빌드 (packages/client/dist)
    deps: [install]
    cmds:
      - npm run build -w @snake/client

  loadtest:
    desc: '부하 테스트 (예: task loadtest -- 100 60 → 클라이언트 100명, 60초)'
    deps: [install]
    cmds:
      - npm run loadtest -- {{.CLI_ARGS}}

  start:
    desc: 클라이언트를 빌드하고 pm2로 게임 서버를 백그라운드 실행
    deps: [build]
    cmds:
      - pm2 startOrRestart ecosystem.config.cjs

  stop:
    desc: pm2에서 게임 서버 중단 및 제거
    cmds:
      - pm2 delete ecosystem.config.cjs

  restart:
    desc: 클라이언트를 다시 빌드하고 게임 서버 재시작 (꺼져 있으면 시작)
    cmds:
      - task: start

  check:
    desc: 커밋 전 검증 (테스트 + 타입 검사 + 빌드)
    cmds:
      - task: test
      - task: typecheck
      - task: build
